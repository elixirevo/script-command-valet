[package]
name = "scv-cli"
version = "0.1.0"
edition = "2024"
description = "Script Command Valet, a cross-platform personal command manager"

[[bin]]
name = "scv"
path = "src/main.rs"

[dependencies]
directories = "6.0"
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "1.0"
