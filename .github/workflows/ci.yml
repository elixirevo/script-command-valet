name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: cargo fmt --check
      - name: Configure Windows validation runtimes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command pwsh -ErrorAction Stop
          $PSVersionTable.PSVersion.ToString()
          # Prefer Git Bash over the Windows/WSL bash.exe launcher.
          $gitCommand = Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $gitRoot = Split-Path (Split-Path $gitCommand.Source -Parent) -Parent
          $gitBin = Join-Path $gitRoot 'bin'
          $gitBash = Join-Path $gitBin 'bash.exe'
          if (-not (Test-Path -LiteralPath $gitBash)) { throw "Git Bash not found: $gitBash" }
          Write-Host "Using Git Bash: $gitBash"
          & $gitBash --version
          if ($LASTEXITCODE -ne 0) { throw 'Git Bash could not start' }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test core, generation statistics, and embedded contracts
        run: cargo test --locked
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build debug binary
        run: cargo build --locked

      - name: Verify Unix binary
        if: runner.os != 'Windows'
        run: |
          ./target/debug/scv --version
          bash -n install.sh

      - name: Verify Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./target/debug/scv.exe --version

      - name: Verify local Unix installer
        if: runner.os != 'Windows'
        run: |
          install_dir="$RUNNER_TEMP/scv install/bin"
          profile="$RUNNER_TEMP/scv-shell-profile"
          SCV_SHELL=zsh SCV_SHELL_PROFILE="$profile" ./install.sh --binary ./target/debug/scv --install-dir "$install_dir"
          SCV_SHELL=zsh SCV_SHELL_PROFILE="$profile" ./install.sh --binary ./target/debug/scv --install-dir "$install_dir"
          test "$(grep -c '# >>> scv >>>' "$profile")" -eq 1
          "$install_dir/scv" --version

      - name: Verify local Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "scv install\bin"
          ./install.ps1 -BinaryPath ./target/debug/scv.exe -InstallDir $installDir -NoModifyPath
          & (Join-Path $installDir "scv.exe") --version
