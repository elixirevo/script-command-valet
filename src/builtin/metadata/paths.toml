name = "paths"
category = "system"
description = "Show the paths SCV uses on the current platform."
usage = "scv paths [--json]"
builtin = true
runtime = "builtin"
platforms = ["windows", "linux", "macos"]
risk = "read"
network = false
supports_dry_run = false
effects = ["reads resolved SCV source, data, config, and cache paths"]

[[options]]
long = "--json"
description = "Print paths as JSON"

[[examples]]
command = "scv paths --json"
