name = "create"
category = "system"
description = "Create a validated persistent SCV command package from a natural-language request."
usage = "scv create <description> [--name <command>] [--locale <en|ko>] [--agent <agent>] [--model <model>] [--effort <level>] [--yes] [--no-input]"
builtin = true
runtime = "builtin"
platforms = ["windows", "linux", "macos"]
risk = "destructive"
network = true
supports_dry_run = false
effects = [
  "invokes one locally installed coding-agent CLI using its existing authentication",
  "creates and removes an isolated temporary generation workspace",
  "stores one validated SCV command package in the Git source after confirmation",
  "creates and activates a validated machine-local command snapshot",
  "prunes old machine-local activations beyond the retention limit",
  "replaces an existing user command when --force is used",
]

[[arguments]]
name = "description"
required = true
description = "Natural-language requirement for the persistent command"

[[options]]
short = "-n"
long = "--name"
value = "<command>"
description = "Require the generated command to use this name"

[[options]]
long = "--locale"
value = "<en|ko>"
description = "Language for generated human-facing text"
default = "ui.locale"

[[options]]
short = "-a"
long = "--agent"
value = "<codex|claude|agy>"
description = "Local coding-agent adapter to use"
default = "config or codex"

[[options]]
short = "-m"
long = "--model"
value = "<model>"
description = "Model name passed directly to the agent"

[[options]]
short = "-e"
long = "--effort"
value = "<low|medium|high|xhigh|max>"
description = "Portable reasoning effort supported by the agent"

[[options]]
long = "--agent-option"
value = "<key=value>"
description = "Codex-specific configuration; may be repeated"

[[options]]
short = "-f"
long = "--force"
description = "Replace an existing user command after approval"

[[options]]
short = "-y"
long = "--yes"
description = "Skip confirmation before installing the validated package"

[[options]]
long = "--no-input"
description = "Disable prompts; package installation also requires --yes"

[[notes]]
text = "The agent writes only to a temporary workspace; only the SCV validator and installer modify the command library."

[[notes]]
text = "SCV automatically disables prompts when stdin is not a terminal."

[[notes]]
text = "Generated packages store one authored language; changing ui.locale later does not translate existing user commands."

[[notes]]
text = "Code generation logs are hidden behind stage progress. Review the validated command summary before approving installation."

[[notes]]
text = "Generation prefers available system tools and minimal implementations. External utilities retain their native output language."

[[examples]]
command = "scv create \"Show directory sizes in descending order\""

[[examples]]
command = "scv create \"Sort a JSON file\" --name json-sort --agent codex --model gpt-5.6-sol --effort high"

[[examples]]
command = "scv create \"Count files in the current directory\" --agent claude --yes --no-input"

[[examples]]
command = "scv create \"현재 디렉터리의 파일 수를 세어줘\" --locale ko --agent agy --yes --no-input"
