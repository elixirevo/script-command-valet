name = "list"
category = "system"
description = "List registered commands by logical category."
usage = "scv list [--all] [--json]"
builtin = true
runtime = "builtin"
platforms = ["windows", "linux", "macos"]
risk = "read"
network = false
supports_dry_run = false
effects = ["reads local SCV command metadata"]

[[options]]
short = "-a"
long = "--all"
description = "Include commands unavailable on the current platform"

[[options]]
long = "--json"
description = "Print a machine-readable JSON array"

[[examples]]
command = "scv list"

[[examples]]
command = "scv list --all"

[[examples]]
command = "scv list --json"
