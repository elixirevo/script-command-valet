name = "sync"
category = "system"
description = "Safely synchronize the SCV command source with Git."
usage = "scv sync [status|pull|push] [options]"
builtin = true
runtime = "builtin"
platforms = ["windows", "linux", "macos"]
risk = "destructive"
network = true
supports_dry_run = true
effects = [
  "reads local Git source status",
  "fetches and validates remote changes in an isolated worktree",
  "fast-forwards the source and creates an activation after approval",
  "prunes old machine-local activations beyond the retention limit",
  "pushes committed source changes when push is selected",
]

[[arguments]]
name = "operation"
required = false
description = "Operation: status, pull, or push"
default = "status"

[[options]]
short = "-y"
long = "--yes"
description = "Skip pull or push confirmation"

[[options]]
long = "--no-input"
description = "Disable prompts; an actual pull or push requires --yes"

[[options]]
long = "--dry-run"
description = "Check whether push can run without changing the remote"

[[options]]
long = "--json"
description = "Print the result as JSON"

[[notes]]
text = "Pull does not support --dry-run because fetch changes Git refs."

[[examples]]
command = "scv sync status --json"

[[examples]]
command = "scv sync pull --yes --no-input"

[[examples]]
command = "scv sync push --dry-run"
