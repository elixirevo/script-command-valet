name = "rollback"
category = "system"
description = "Switch to a validated previous SCV activation."
usage = "scv rollback [activation] [--dry-run] [--json]"
builtin = true
runtime = "builtin"
platforms = ["windows", "linux", "macos"]
risk = "write"
network = false
supports_dry_run = true
effects = ["atomically changes the current activation pointer"]

[[arguments]]
name = "activation"
required = false
description = "Activation ID to select"
default = "Most recent previous activation"

[[options]]
long = "--dry-run"
description = "Show the target activation without switching"

[[options]]
long = "--json"
description = "Print the result as JSON"

[[examples]]
command = "scv rollback --dry-run"

[[examples]]
command = "scv rollback"
