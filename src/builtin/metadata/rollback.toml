name = "rollback"
category = "system"
description = "검증된 이전 SCV activation으로 전환합니다."
usage = "scv rollback [activation] [--dry-run] [--json]"
builtin = true
runtime = "builtin"
platforms = ["windows", "linux", "macos"]
risk = "write"
network = false
supports_dry_run = true
effects = ["atomically changes the current activation pointer"]

[[arguments]]
name = "activation"
required = false
description = "전환할 activation ID"
default = "가장 최근의 이전 activation"

[[options]]
long = "--dry-run"
description = "전환할 activation만 표시하고 변경하지 않음"

[[options]]
long = "--json"
description = "결과를 JSON으로 출력"

[[examples]]
command = "scv rollback --dry-run"

[[examples]]
command = "scv rollback"
