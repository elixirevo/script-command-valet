name = "apply"
category = "system"
description = "Validate the SCV source and apply it as a new activation."
usage = "scv apply [--dry-run] [--json]"
builtin = true
runtime = "builtin"
platforms = ["windows", "linux", "macos"]
risk = "destructive"
network = false
supports_dry_run = true
effects = [
  "validates every command package in the SCV source library",
  "creates an immutable machine-local activation",
  "atomically changes the current activation",
  "prunes old machine-local activations beyond the retention limit",
]

[[options]]
long = "--dry-run"
description = "Validate the source without creating an activation"

[[options]]
long = "--json"
description = "Print the result as JSON"

[[examples]]
command = "scv apply --dry-run"

[[examples]]
command = "scv apply"
