name = "info"
category = "system"
description = "Show command help and runtime information."
usage = "scv info <command> [--json]"
builtin = true
runtime = "builtin"
platforms = ["windows", "linux", "macos"]
risk = "read"
network = false
supports_dry_run = false
effects = ["reads local SCV command metadata"]

[[arguments]]
name = "command"
required = true
description = "Command name to inspect"

[[options]]
long = "--json"
description = "Print a machine-readable JSON object"

[[examples]]
command = "scv info gh-org-clone"

[[examples]]
command = "scv info gh-org-clone --json"
