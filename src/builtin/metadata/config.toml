name = "config"
category = "system"
description = "View or change machine-local SCV settings."
usage = "scv config [show [--json] | set <key> <value> [--dry-run]]"
builtin = true
runtime = "builtin"
platforms = ["windows", "linux", "macos"]
risk = "write"
network = false
supports_dry_run = true
effects = ["reads or updates the local SCV config.toml file"]

[[arguments]]
name = "action"
required = false
description = "show or set"
default = "show"

[[arguments]]
name = "key/value"
required = false
description = "Configuration key and value for set"

[[options]]
long = "--json"
description = "Print show output as a machine-readable JSON object"

[[options]]
long = "--dry-run"
description = "Preview set without changing the config file"

[[notes]]
text = "Supports ui.locale; agent, model, and effort shortcuts; create.agent/model/effort; and agents.<agent>.model/effort keys."

[[examples]]
command = "scv config show"

[[examples]]
command = "scv config set agent codex"

[[examples]]
command = "scv config set model gpt-5.6-sol"

[[examples]]
command = "scv config set effort high --dry-run"
