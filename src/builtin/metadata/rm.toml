name = "rm"
category = "system"
description = "Remove a registered user command from SCV."
usage = "scv rm <command> [--yes] [--dry-run] [--no-input]"
builtin = true
runtime = "builtin"
platforms = ["windows", "linux", "macos"]
risk = "destructive"
network = false
supports_dry_run = true
effects = [
  "deletes one registered command package and its implementations",
  "creates a new activation without the removed package",
  "prunes old machine-local activations beyond the retention limit",
]

[[arguments]]
name = "command"
required = true
description = "User command name to remove"

[[options]]
short = "-y"
long = "--yes"
description = "Remove without a confirmation prompt"

[[options]]
long = "--dry-run"
description = "Show the removal target without deleting files"

[[options]]
long = "--no-input"
description = "Disable prompts; actual removal also requires --yes"

[[notes]]
text = "SCV builtins declared with builtin = true cannot be removed."

[[notes]]
text = "SCV automatically disables prompts when stdin is not a terminal."

[[examples]]
command = "scv rm gh-org-migrate"

[[examples]]
command = "scv rm gh-org-migrate --dry-run"

[[examples]]
command = "scv rm gh-org-migrate --yes --no-input"
