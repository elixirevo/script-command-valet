name = "add"
category = "system"
description = "Register an external script or binary with SCV."
usage = "scv add <script> [options] [--no-input]"
builtin = true
runtime = "builtin"
platforms = ["windows", "linux", "macos"]
risk = "destructive"
network = false
supports_dry_run = true
effects = [
  "creates one SCV command package",
  "copies one local implementation into the package",
  "writes package metadata.toml",
  "creates and activates a validated machine-local command snapshot",
  "prunes old machine-local activations beyond the retention limit",
  "replaces an existing user command when --force is used",
]

[[arguments]]
name = "script"
required = true
description = "Script or binary path to register"

[[options]]
short = "-c"
long = "--category"
value = "<category>"
description = "Logical category"

[[options]]
short = "-d"
long = "--description"
value = "<description>"
description = "Command description"

[[options]]
short = "-u"
long = "--usage"
value = "<usage>"
description = "Usage form"
default = "scv <command>"

[[options]]
short = "-n"
long = "--name"
value = "<command>"
description = "Command name to invoke"

[[options]]
short = "-r"
long = "--runtime"
value = "<runtime>"
description = "Runtime: bash, node, python, pwsh, or binary"

[[options]]
short = "-p"
long = "--platforms"
value = "<platforms>"
description = "Comma-separated platforms: windows,linux,macos"
default = "Current platform"

[[options]]
long = "--risk"
value = "<read|write|destructive>"
description = "Maximum command risk"

[[options]]
long = "--network"
value = "<true|false>"
description = "Whether the command requires network access"

[[options]]
long = "--supports-dry-run"
value = "<true|false>"
description = "Whether the registered command supports --dry-run"

[[options]]
long = "--effect"
value = "<description>"
description = "Observable command effect; may be repeated"

[[options]]
short = "-f"
long = "--force"
description = "Replace an existing user command with the same name"

[[options]]
long = "--dry-run"
description = "Validate the registration plan without changing files"

[[options]]
long = "--no-input"
description = "Disable prompts and reject missing required metadata"

[[notes]]
text = "The source file is not modified; SCV creates the implementation and metadata.toml under SCV_HOME/commands/<command>/."

[[notes]]
text = "SCV does not prompt when stdin is not a terminal, even without --no-input."

[[examples]]
command = "scv add ./clone.sh"

[[examples]]
command = "scv add ./clone.sh --category github --description \"GitHub clone command\""

[[examples]]
command = "scv add ./clone.sh --category github --description \"GitHub clone command\" --usage \"scv gh-org-clone <organization> [--directory <path>]\" --name gh-org-clone"

[[examples]]
command = "scv add ./tool.exe --runtime binary --platforms windows --category system --description \"Windows tool\" --risk write --network false --supports-dry-run false --effect \"writes local files\" --no-input"
