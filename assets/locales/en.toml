[builtins.history]
description = "List and rerun validated one-shot command history."
effects = [
  "reads machine-local one-shot command history",
  "revalidates a stored package and its SHA-256 digest before rerunning it",
  "runs the selected stored package in the current working directory after confirmation",
  "may perform local, remote, or destructive effects declared by the stored package",
]
notes = [
  "History is machine-local and is not added to the Git-backed command source.",
  "Reruns use the current working directory, not the directory recorded when the entry was created.",
  "SCV retains the newest 100 entries and removes older entries after saving a new one-shot command.",
  "Validation checks package structure and available runtime syntax, not intended behavior. Review the command description and effects before execution.",
]

[builtins.history.arguments]
action = "Action: list or run"
id = "History entry ID required by run"

[builtins.history.options]
"--json" = "Print list results as a machine-readable JSON array"
"--yes" = "Skip confirmation before rerunning the stored package"
"--no-input" = "Disable prompts; rerunning also requires --yes"

[builtins.history.defaults]
action = "list"
