[builtins.create]
description = "자연어 요청으로 검증된 영구 SCV command package를 생성합니다."
effects = [
  "기존 인증을 사용하는 로컬 coding-agent CLI 하나를 호출합니다",
  "격리된 임시 생성 workspace를 만들고 제거합니다",
  "확인 후 검증된 SCV command package 하나를 Git source에 저장합니다",
  "검증된 machine-local command snapshot을 생성하고 활성화합니다",
  "보존 한도를 넘는 이전 machine-local activation을 정리합니다",
  "--force 사용 시 기존 사용자 명령을 교체합니다",
]
notes = [
  "agent는 임시 workspace에만 쓰며 SCV validator와 installer만 command library를 변경합니다.",
  "stdin이 터미널이 아니면 자동으로 입력을 금지합니다.",
  "생성 package는 선택한 언어 하나를 원문으로 저장하므로 나중에 ui.locale을 바꿔도 기존 사용자 command는 번역되지 않습니다.",
  "코드 생성 로그는 숨기고 단계별 진행 상태를 표시합니다. 검증 후 명령 요약을 확인하고 설치를 승인합니다.",
  "사용 가능한 시스템 도구로 간결하게 구현하도록 생성합니다. 외부 도구의 출력 언어는 그대로 유지합니다.",
  "승인 전에 생성 소요 시간과 CLI가 보고한 토큰 사용량을 표시합니다. 준비와 검증 시간을 포함하며, 사용량을 받지 못하면 확인 불가로 표시합니다.",
]

