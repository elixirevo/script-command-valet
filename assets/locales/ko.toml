[builtins.history]
description = "검증된 일회성 command history를 표시하고 다시 실행합니다."
effects = [
  "machine-local 일회성 command history를 읽습니다",
  "다시 실행하기 전에 저장된 package와 SHA-256 digest를 재검증합니다",
  "확인 후 선택한 package를 현재 작업 디렉터리에서 실행합니다",
  "저장된 package가 선언한 로컬, 원격 또는 파괴적 효과를 수행할 수 있습니다",
]
notes = [
  "History는 machine-local이며 Git 기반 command source에 추가되지 않습니다.",
  "재실행은 항목을 생성한 디렉터리가 아니라 현재 작업 디렉터리를 사용합니다.",
  "SCV는 최신 100개 항목을 보존하고 새 일회성 command를 저장한 뒤 더 오래된 항목을 제거합니다.",
  "검증은 패키지 구조와 사용 가능한 런타임의 문법을 확인하며, 의도한 동작까지 확인하지는 않습니다. 실행 전 명령의 설명과 작업 내용을 확인해 주세요.",
]

[builtins.history.arguments]
action = "동작: list 또는 run"
id = "run에 필요한 history 항목 ID"

[builtins.history.options]
"--json" = "list 결과를 기계 판독 가능한 JSON 배열로 출력"
"--yes" = "저장된 package를 다시 실행하기 전 확인을 생략"
"--no-input" = "질문을 금지; 재실행에는 --yes도 필요"

[builtins.history.defaults]
action = "list"

[builtins.init]
description = "SCV 소스, 기본 설정, Git 저장소 설정을 초기화합니다."
effects = [
  "SCV source manifest와 command 디렉터리를 생성합니다",
  "필요하면 로컬 Git 저장소를 초기화합니다",
  "machine-local 로케일과 create agent 기본값을 저장합니다",
  "--remote가 있으면 Git origin remote를 추가하거나 재설정합니다",
  "--reconfigure와 --no-remote를 함께 사용하면 기존 Git origin을 제거합니다",
]
notes = [
  "init은 원격 저장소를 생성하거나 네트워크에 접근하지 않으며 credential 저장, commit, push도 하지 않습니다.",
  "인자 없는 scv 실행은 설정이 없고 stdin이 터미널일 때만 init을 시작합니다.",
  "--reconfigure는 기존 source manifest와 command package를 보존합니다.",
  "대화형 설정은 방향키 선택 UI를 사용하며 Esc 또는 Ctrl+C를 누르면 변경 전에 취소합니다.",
]

[builtins.init.options]
"--locale" = "UI 로케일"
"--agent" = "create에서 기본으로 사용할 로컬 coding-agent command"
"--remote" = "접속하지 않고 origin으로 저장할 Git URL 또는 경로"
"--reconfigure" = "기존 command source를 보존하면서 설정과 Git origin을 다시 구성"
"--no-remote" = "재설정 중 기존 Git origin 제거"
"--dry-run" = "파일을 변경하지 않고 초기화 계획만 표시"
"--no-input" = "질문을 금지하고 지정하지 않은 설정에는 기본값 사용"

[builtins.init.defaults]
"--locale" = "기존 설정 또는 en"
"--agent" = "기존 설정 또는 codex"

[builtins.add]
description = "외부 스크립트나 바이너리를 SCV에 등록합니다."
effects = [
  "SCV command package 하나를 생성합니다",
  "로컬 implementation 하나를 package에 복사합니다",
  "package metadata.toml을 작성합니다",
  "검증된 machine-local command snapshot을 생성하고 활성화합니다",
  "보존 한도를 넘는 이전 machine-local activation을 정리합니다",
  "--force 사용 시 기존 사용자 명령을 교체합니다",
]
notes = [
  "원본 파일은 수정하지 않고 SCV_HOME/commands/<command>/ package에 implementation과 metadata.toml을 생성합니다.",
  "stdin이 터미널이 아니면 --no-input을 생략해도 질문하지 않습니다.",
]

[builtins.add.arguments]
script = "등록할 스크립트 또는 바이너리 경로"

[builtins.add.options]
"--category" = "논리적 카테고리"
"--description" = "명령 설명"
"--usage" = "사용 형식"
"--name" = "실행할 명령 이름"
"--runtime" = "실행 방식: bash, node, python, pwsh, binary"
"--platforms" = "지원 플랫폼을 쉼표로 구분: windows,linux,macos"
"--risk" = "명령의 최대 위험도"
"--network" = "명령의 네트워크 필요 여부"
