operation = "동작: status, pull, push"

[builtins.sync.options]
"--yes" = "pull 또는 push 확인 질문을 생략"
"--no-input" = "질문을 금지; 실제 pull 또는 push에는 --yes 필요"
"--dry-run" = "push 가능 여부만 검사하고 원격을 변경하지 않음"
"--json" = "결과를 JSON으로 출력"

[builtins.sync.defaults]
operation = "status"
