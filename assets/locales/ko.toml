"--effect" = "명령의 관찰 가능한 효과; 여러 번 지정 가능"
"--force" = "동일한 사용자 명령이 존재하면 덮어쓰기"
"--dry-run" = "등록 계획만 검증하고 파일을 변경하지 않음"
"--no-input" = "질문을 금지하고 누락된 필수 metadata를 오류로 처리"

[builtins.add.defaults]
"--usage" = "scv <command>"
"--platforms" = "현재 플랫폼"

[builtins.apply]
description = "SCV source를 검증하고 새로운 activation으로 적용합니다."
effects = [
  "SCV source library의 모든 command package를 검증합니다",
  "변경할 수 없는 machine-local activation을 생성합니다",
  "현재 activation을 원자적으로 변경합니다",
  "보존 한도를 넘는 이전 machine-local activation을 정리합니다",
]

[builtins.apply.options]
"--dry-run" = "source만 검증하고 activation을 생성하지 않음"
"--json" = "결과를 JSON으로 출력"

[builtins.config]
description = "machine-local SCV 설정을 조회하거나 변경합니다."
effects = ["로컬 SCV config.toml 파일을 읽거나 변경합니다"]
notes = ["agent, model, effort 단축 키와 ui.locale, create.agent, create.model, create.effort, agents.<agent>.model/effort 키를 지원합니다."]

[builtins.config.arguments]
action = "show 또는 set"
"key/value" = "set에서 변경할 설정 키와 값"

[builtins.config.options]
"--json" = "show 결과를 기계 판독 가능한 JSON 객체로 출력"
"--dry-run" = "set 결과만 표시하고 config 파일을 변경하지 않음"

[builtins.config.defaults]
